# DevLake config-ui — monochart values (component `devlake-ui`, workDir=config-ui).
# This is the human entrypoint. The gateway path-routes /grafana to grafana and
# /api + / to config-ui (see httproute rules); config-ui's nginx then proxies
# /api to the lake. (We do NOT proxy /grafana through nginx — its Host-header
# rewrite loops against the gateway's host-based routing.)

deployment:
  enabled: true
  pod:
    containers:
      default:
        livenessProbe:
          httpGet:
            path: /
            port: default
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: default
          initialDelaySeconds: 5
          periodSeconds: 10

replicaCount: 1
podDisruptionBudget:
  enabled: false

resources:
  cpu: 100m
  memory: 256Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    default:
      containerPort: 4000
      servicePort: 4000

# Single-host gateway routing (modeled on the Terraform deploy): everything is
# on the devlake-ui host ({account}-{uuid}-devlake-ui.{domain}); the gateway
# path-routes /grafana straight to grafana (NOT through config-ui's nginx proxy,
# which would loop on the Host header), and /api + / to config-ui. Internal
# gateway, no OIDC.
httproute:
  default:
    enabled: true
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /grafana
        backendRefs:
          - name: devlake-grafana
            port: 3000
      - matches:
          - path:
              type: PathPrefix
              value: /api
        backendRefs:
          - name: devlake-ui
            port: 4000
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: devlake-ui
            port: 4000

configMaps:
  default:
    enabled: true
    env:
      # config-ui proxies /api to the lake via its per-stage subdomain (uuid
      # dynamic via stageConfig); this path does NOT loop because the /api nginx
      # block doesn't override the Host header. /grafana is handled at the gateway
      # (see httproute rules above), so no GRAFANA_ENDPOINT proxy is needed here.
      DEVLAKE_ENDPOINT: "{{.Values.stageConfig.account}}-{{.Values.stageConfig.uuid}}-devlake.{{.Values.domain}}"
      DEVLAKE_ENDPOINT_PROTO: https
