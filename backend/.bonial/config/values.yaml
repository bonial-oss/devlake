# DevLake lake/backend — monochart values (deployed via aws-stage-configuration
# component `devlake`, template spinnaker/k8s, workDir=backend).
# Image is built from this dir's Dockerfile and injected by Spinnaker as
# images.default. Stateless Deployment; exposed only on the internal gateway.

deployment:
  enabled: true
  # DevLake is single-instance and holds a DB lock (_devlake_locking_stub); a
  # rolling update surges a second pod that can't acquire the lock and crash-loops
  # (locking timeout), stalling the rollout. Recreate terminates the old pod before
  # starting the new one so the lock is free.
  strategy:
    type: Recreate
  pod:
    containers:
      default:
        livenessProbe:
          httpGet:
            path: /ping
            port: default
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: default
          initialDelaySeconds: 10
          periodSeconds: 10
        # startupProbe gives the first boot up to ~5 min (migrations / init)
        # before liveness can kill it — avoids killing the pod mid-startup.
        startupProbe:
          httpGet:
            path: /ping
            port: default
          periodSeconds: 10
          failureThreshold: 30

replicaCount: 1            # the lake runs pipelines; keep a single instance
podDisruptionBudget:
  enabled: false           # single replica

# The monochart sets these as requests; limits = request * 1.25. The lake runs
# collection pipelines: full-clone gitextractor on large repos and the dora
# commit-ancestry walk (loads commit_parents into memory) are memory-heavy, and
# 512Mi (640Mi limit) OOM-killed the pod mid-clone. Give it real headroom.
resources:
  cpu: "1"
  memory: 4Gi

service:
  enabled: true
  type: ClusterIP
  ports:
    default:
      containerPort: 8080
      servicePort: 8080

# Internal-only HTTPRoute (default gateway is `internal`, no OIDC). Required so
# config-ui can reach the lake at https://{account}-{uuid}-devlake.{domain}/.
httproute:
  default:
    enabled: true

configMaps:
  default:
    enabled: true
    env:
      PORT: "8080"
      MODE: release
      LOGGING_DIR: /app/logs
      ENABLE_BOT_FILTERING: "true"
      BOT_FILTERING_PATTERN: '.*(\[bot\]|-bot).*'
      # Do NOT resume pipelines from the production snapshot on boot. The
      # snapshot has many TASK_RUNNING rows; the startup
      # `UPDATE _devlake_tasks SET status='TASK_RESUME' WHERE status='TASK_RUNNING'`
      # hit a lock-wait timeout (Error 1205) and crash-looped the pod.
      RESUME_PIPELINES: "false"

# DB_URL (contains the password) and ENCRYPTION_SECRET come from the SOPS-
# encrypted stage/secrets.yaml.
secrets:
  default:
    enabled: true
