# DevLake grafana (devlake-dashboard) — monochart values (component
# `devlake-grafana`, workDir=grafana). Stateful: persists /var/lib/grafana via a
# StatefulSet volumeClaimTemplate (StatefulSet support requires monochart >=3.13.0).
# Reads the data lake populates from the same MySQL (devlake-db). The image bakes
# GF_SERVER_SERVE_FROM_SUB_PATH=true, so grafana serves correctly under /grafana.

statefulset:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 4Gi
  pod:
    # Grafana runs as UID 472; fsGroup makes the PVC group-writable so it can
    # write /var/lib/grafana (otherwise: "GF_PATHS_DATA is not writable").
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    containers:
      default:
        volumeMounts:
          - name: data
            mountPath: /var/lib/grafana
        livenessProbe:
          httpGet:
            path: /api/health
            port: default
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: default
          initialDelaySeconds: 10
          periodSeconds: 10

replicaCount: 1
podDisruptionBudget:
  enabled: false

resources:
  cpu: 100m
  memory: 256Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    default:
      containerPort: 3000
      servicePort: 3000

# Internal-only HTTPRoute so config-ui can reach grafana at
# https://{account}-{uuid}-devlake-grafana.{domain}/.
httproute:
  default:
    enabled: true

configMaps:
  default:
    enabled: true
    env:
      # Public root URL users hit (through config-ui's /grafana proxy).
      GF_SERVER_ROOT_URL: "https://{{.Values.stageConfig.account}}-{{.Values.stageConfig.uuid}}-devlake-ui.{{.Values.domain}}/grafana"
      GF_USERS_DEFAULT_THEME: light
      # MySQL datasource (devlake-db) — uuid dynamic via stageConfig.
      MYSQL_URL: "{{.Values.stageConfig.account}}-{{.Values.stageConfig.uuid}}-devlake-db.{{.Values.domain}}:3306"
      MYSQL_DATABASE: devlake
      MYSQL_USER: devlake

# MYSQL_PASSWORD (and optional admin password) come from stage/secrets.yaml.
secrets:
  default:
    enabled: true
